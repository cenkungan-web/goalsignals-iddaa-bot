# GoalSignals.com.tr Nginx Configuration
# Option 1: As a dedicated subdomain (bilyoner.goalsignals.com.tr)
server {
    listen 80;
    server_name bilyoner.goalsignals.com.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bilyoner.goalsignals.com.tr;

    # SSL Certificates (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/bilyoner.goalsignals.com.tr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bilyoner.goalsignals.com.tr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) live progress support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}

